sae:
  model_name: "andreuka18/sae-deepseek-r1-llama-8b"


strategies:
  direct:
    max_new_tokens: 2048
    skip: false
    prompt_template: |
      <|begin▁of▁sentence|><|User|>
      Answer the question directly.

      Rules:
      - Return exactly one line.
      - Do not explain.
      - Do not include analysis.
      - Do not include intermediate steps.
      - Use exactly this format:

      Question: {question}<|end|><think>\n\n</think>\n\n
      <|Assistant|>Therefore, the answer is <|Answer|>

  cot:
    max_new_tokens: 2048
    skip: false
    prompt_template: |
      <|begin▁of▁sentence|>
      You are a logical reasoning assistant. Solve the user's question by breaking it down into logical steps.
      Finally, provide the answer in the specified format.
      <|User|>
      Question: {question}

      Please think step by step, and at the end output:
      Therefore, the answer is [your answer].
      <|Assistant|><think>
      
  explain:
    max_new_tokens: 512
    skip: true
    prompt_template: |
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n
      You are a helpful assistant. Explain how to solve the user's question.
      Finally, provide the answer in the specified format.<|eot_id|>
      <|start_header_id|>user<|end_header_id|>\n\n
      Question: {question}\n\n
      Explain how you get the answer.\n\n:
      Format your final response as: 'Therefore, the answer is [your answer].'<|eot_id|>
      <|start_header_id|>assistant<|end_header_id|>\n\n

  solve:
    max_new_tokens: 512
    skip: true
    prompt_template: |
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n
      You are a helpful assistant. Solve the user's question carefully.
      Finally, provide the answer in the specified format.<|eot_id|>
      <|start_header_id|>user<|end_header_id|>\n\n
      Question: {question}\n\n
      Solve the problem carefully.\n\n
      Format your final response as: 'Therefore, the answer is [your answer].'<|eot_id|>
      <|start_header_id|>assistant<|end_header_id|>\n\n

  think:
    max_new_tokens: 512
    skip: true
    prompt_template: |
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n
      You are a helpful assistant. Think carefully before answering.
      Finally, provide the answer in the specified format.<|eot_id|>
      <|start_header_id|>user<|end_header_id|>\n\n
      Question: {question}\n\n
      Think carefully before answering.\n\n
      Format your final response as: 'Therefore, the answer is [your answer].'<|eot_id|>
      <|start_header_id|>assistant<|end_header_id|>\n\n

  hint:
    max_new_tokens: 512
    skip: true

  cot_hint:
    max_new_tokens: 256
    skip: true
  
  pesudo_reason:
    max_new_tokens: 512
    skip: true




