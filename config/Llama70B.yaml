dataset:
  name: "gpqa"
  split: "train"
  max_samples: 1000  # For quick testing, increase for full experiments
  data_subset: "gpqa_diamond"  # Options: gpqa_diamond, gpqa_experts, gpqa_extended
  # name: "gsm8k"  # Can be extended to other datasets
  # split: "test"
  # max_samples: 1000  # For quick testing, increase for full experiments
  # paths: "data/raw/grade-school-math/grade_school_math/data" # Path to GSM8K dataset

model:
  # name: "meta-llama/Meta-Llama-3.1-8B-Instruct"  # Base LLM model
  name: "meta-llama/Llama-3.3-70B-Instruct"  # Base LLM model
  # name: "meta-llama/Meta-Llama-3-8B-Instruct"  # Base LLM model

sae:
  # model_name: "Goodfire/Llama-3.1-8B-Instruct-SAE-l19"
  model_name: "Goodfire/Llama-3.3-70B-Instruct-SAE-l50"
  # model_name: "EleutherAI/sae-llama-3-8b-32x"

strategies:
  direct:
    max_new_tokens: 512
    skip: false
    # prompt_template: |
    #   <|begin_of_text|><|start_header_id|>system<|end_header_id|>
      
    #   You are a helpful assistant.<|eot_id|><|start_header_id|>user<|end_header_id|>
      
    #   {question}
      
    #   Format your response as: your answer here.<|eot_id|><|start_header_id|>assistant<|end_header_id|>

  cot:
    max_new_tokens: 512
    skip: false
    # prompt_template: |
    #   <|begin_of_text|><|start_header_id|>system<|end_header_id|>
      
    #   You are a logical reasoning assistant. Solve the user's question by breaking it down into logical steps. Finally, provide the answer in the specified format.<|eot_id|><|start_header_id|>user<|end_header_id|>
      
    #   {question}
      
    #   Let's think step by step:
    #   1) Analyze the given information.
    #   2) Deduce intermediate conclusions
    #   3) Finalize the answer.
      
    #   Format your final response as: 'Therefore, the answer is [your answer].'<|eot_id|><|start_header_id|>assistant<|end_header_id|>

  hint:
    max_new_tokens: 512
    skip: true

  cot_hint:
    max_new_tokens: 256
    skip: true




experiment:
  output_dir: "./results"
  random_seed: 42
