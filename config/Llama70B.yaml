dataset:
  # name: "gpqa"
  # split: "train"
  # max_samples: 1000  # For quick testing, increase for full experiments
  # data_subset: "gpqa_diamond"  # Options: gpqa_diamond, gpqa_experts, gpqa_extended
  name: "gsm8k"  # Can be extended to other datasets
  split: "test"
  max_samples: 2  # For quick testing, increase for full experiments
  paths: "data/raw/grade-school-math/grade_school_math/data" # Path to GSM8K dataset
  # name: "bbh"
  # split: "logical_deduction_three_objects"
  # max_samples: 200  # For quick testing, increase for full experiments
  # paths: "data/BIG-Bench-Hard/bbh/" # Path to BBH dataset

model:
  # name: "meta-llama/Meta-Llama-3.1-8B-Instruct"  # Base LLM model
  name: "meta-llama/Llama-3.3-70B-Instruct"  # Base LLM model
  # name: "meta-llama/Meta-Llama-3-8B-Instruct"  # Base LLM model

sae:
  # model_name: "Goodfire/Llama-3.1-8B-Instruct-SAE-l19"
  model_name: "Goodfire/Llama-3.3-70B-Instruct-SAE-l50"
  # model_name: "EleutherAI/sae-llama-3-8b-32x"

strategies:
  direct:
    max_new_tokens: 512
    skip: true
    prompt_template: |
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n
      You are a helpful assistant.<|eot_id|>
      <|start_header_id|>user<|end_header_id|>\n\n
      Question: {question}\n\n
      Give me the answer directly without explanations.<|eot_id|>
      <|start_header_id|>assistant<|end_header_id|>\n\n

  cot:
    max_new_tokens: 512
    skip: false
    prompt_template: |
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n
      You are a logical reasoning assistant. Solve the user's question by breaking it down into logical steps.
      Finally, provide the answer in the specified format.<|eot_id|>
      <|start_header_id|>user<|end_header_id|>\n\n
      Question: {question}\n\n
      Let's think step by step:\n
      1) Analyze the given information.\n
      2) Deduce intermediate conclusions.\n
      3) Finalize the answer.\n\n
      Format your final response as: 'Therefore, the answer is [your answer].'<|eot_id|>
      <|start_header_id|>assistant<|end_header_id|>\n\n"  
      
  hint:
    max_new_tokens: 512
    skip: true

  cot_hint:
    max_new_tokens: 256
    skip: true




experiment:
  output_dir: "./results"
  random_seed: 42
